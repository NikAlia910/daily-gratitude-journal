name: Application CI
on: [push, pull_request]
jobs:
  pipeline:
    name: dailyGratitudeJournal pipeline
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.pull_request.title, '[skip ci]') && !contains(github.event.pull_request.title, '[ci skip]')"
    timeout-minutes: 40
    env:
      NODE_VERSION: 22.15.0
      SPRING_OUTPUT_ANSI_ENABLED: DETECT
      SPRING_JPA_SHOW_SQL: false
      JHI_DISABLE_WEBPACK_LOGS: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
      - name: Install Node.js packages
        run: npm install
      - name: Make mvnw executable
        run: chmod +x mvnw
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Start backend server
        run: |
          nohup ./mvnw -Dskip.installnodenpm -Dskip.npm -ntp --batch-mode spring-boot:run &
          npx wait-on http://localhost:8080/

      - name: Run JUnit
        run: ./mvnw clean test jacoco:report -Dspring.profiles.active=test

      - name: Upload JUnit Test Report with JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-test-report
          path: target/site/jacoco/**

      - name: Run Jest
        run: npm run ci:frontend:test

      - name: Run Spring test
        run: ./mvnw -ntp -Dskip.installnodenpm -Dskip.npm verify jacoco:report --batch-mode -Dlogging.level.ROOT=OFF -Dlogging.level.tech.jhipster=OFF -Dlogging.level.com.mycompany.myapp=OFF -Dlogging.level.org.springframework=OFF -Dlogging.level.org.springframework.web=OFF -Dlogging.level.org.springframework.security=OFF

      - name: Upload Spring Test Report with JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spring-test-report
          path: target/site/jacoco/**

      - name: Run Cypress
        run: |
          npm run java:jar:prod
          npm run ci:e2e:package
          npm run ci:e2e:prepare
          npm run ci:e2e:run
          npm run ci:e2e:teardown
        env:
          CYPRESS_ENABLE_RECORD: false
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

      - name: Run Gatling
        run: npm run ci:performance:test

      - name: Upload Gatling Report
        uses: actions/upload-artifact@v4
        with:
          name: gatling-report
          path: target/gatling/**
